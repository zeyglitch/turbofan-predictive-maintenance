stages:
  download:
    cmd: python -m pipeline.download
    deps:
      - pipeline/download.py
      - turbofan/data.py
    params:
      - data.url
      - data.inner_sha256
    outs:
      - data/raw

  prepare:
    cmd: python -m pipeline.prepare
    deps:
      - pipeline/prepare.py
      - turbofan/config.py
      - turbofan/data.py
      - turbofan/labels.py
      - turbofan/preprocessing.py
      - turbofan/subsets.py
      - data/raw
    params:
      - data.subset
      - prepare
      - split
    outs:
      - data/processed
      - models/scaler.joblib
    metrics:
      - reports/prepare.json:
          cache: false

  featurize:
    cmd: python -m pipeline.featurize
    deps:
      - pipeline/featurize.py
      - turbofan/config.py
      - turbofan/features.py
      - data/processed
    params:
      - prepare.sensors
      - features
    outs:
      - data/features

  train_classic:
    cmd: python -m pipeline.train_classic
    deps:
      - pipeline/train_classic.py
      - turbofan/config.py
      - turbofan/features.py
      - turbofan/classic_models.py
      - turbofan/metrics.py
      - turbofan/plots.py
      - data/features
    params:
      - data.subset
      - prepare
      - split.seed
      - features
      - alert
      - ridge
      - random_forest
      - xgboost
    outs:
      - models/baseline.json
      - models/ridge.joblib
      - models/random_forest.joblib
      - models/xgboost.json
    metrics:
      - reports/metrics/val_classic.json:
          cache: false

  train_deep:
    cmd: python -m pipeline.train_deep
    deps:
      - pipeline/train_deep.py
      - turbofan/config.py
      - turbofan/windows.py
      - turbofan/networks.py
      - turbofan/training.py
      - turbofan/metrics.py
      - turbofan/plots.py
      - data/processed
    params:
      - data.subset
      - prepare
      - split.seed
      - alert
      - windows
      - lstm
      - cnn
      - training
    outs:
      - models/lstm.pt
      - models/cnn.pt
      - reports/training_curves.csv
    metrics:
      - reports/metrics/val_deep.json:
          cache: false

  evaluate:
    cmd: python -m pipeline.evaluate
    deps:
      - pipeline/evaluate.py
      - turbofan/config.py
      - turbofan/classic_models.py
      - turbofan/conformal.py
      - turbofan/features.py
      - turbofan/metrics.py
      - turbofan/networks.py
      - turbofan/training.py
      - turbofan/windows.py
      - data/features
      - data/processed
      - models/baseline.json
      - models/ridge.joblib
      - models/random_forest.joblib
      - models/xgboost.json
      - models/lstm.pt
      - models/cnn.pt
    params:
      - prepare
      - windows
      - lstm
      - cnn
      - alert
      - conformal
    outs:
      - reports/predictions_test.parquet
    metrics:
      - reports/metrics/test.json:
          cache: false

  register:
    cmd: python -m pipeline.register
    deps:
      - pipeline/register.py
      - pipeline/evaluate.py
      - turbofan/bundle.py
      - turbofan/networks.py
      - turbofan/windows.py
      - models/scaler.joblib
      - models/ridge.joblib
      - models/random_forest.joblib
      - models/xgboost.json
      - models/lstm.pt
      - models/cnn.pt
      - data/features/val.parquet
      - data/processed/val.parquet
      - reports/metrics/val_classic.json
      - reports/metrics/val_deep.json
      - reports/metrics/test.json
    params:
      - data.subset
      - prepare
      - features.rolling_window
      - windows
      - alert
      - ridge
      - random_forest
      - xgboost
      - lstm
      - cnn
    outs:
      # persist: DVC never restores this stage from its run cache, so that the registry alias
      # set by the script always matches the bundle on disk
      - models/champion:
          persist: true
    metrics:
      - reports/champion.json:
          cache: false

  explain:
    cmd: python -m pipeline.explain
    deps:
      - pipeline/explain.py
      - pipeline/evaluate.py
      - turbofan/explain.py
      - turbofan/features.py
      - turbofan/metrics.py
      - turbofan/networks.py
      - turbofan/plots.py
      - turbofan/training.py
      - turbofan/windows.py
      - data/features/val.parquet
      - data/processed/val.parquet
      - models/xgboost.json
      - models/lstm.pt
    params:
      - prepare
      - windows
      - lstm
      - explain
    outs:
      - reports/explain