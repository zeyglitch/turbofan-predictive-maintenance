data:
  subset: FD001
  url: "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
  inner_sha256: "74bef434a34db25c7bf72e668ea4cd52afe5f2cf8e44367c55a82bfd91a5a34f"

prepare:
  rul_cap: 125
  sensors: [s_2, s_3, s_4, s_7, s_8, s_9, s_11, s_12, s_13, s_14, s_15, s_17, s_20, s_21]

regimes:
  # FD002 and FD004 fly at six regimes; true: scale each sensor within its own regime
  normalize: false

split:
  seed: 42
  # shares of the engines of each subset: 15 and 15 of FD001's 100, 39 and 39 of FD002's 260
  val_share: 0.15
  calib_share: 0.15

features:
  rolling_window: 30

ridge:
  alpha: 1.0

alert:
  threshold: 30

random_forest:
  # kept after python -m pipeline.grid random_forest: shallower trees or bigger leaves narrow the
  # gap between train and validation, but raise the validation RMSE (17.82 -> 18.06 to 19.51)
  n_estimators: 200
  max_depth: 12
  min_samples_leaf: 5
  random_state: 42

xgboost:
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 3
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42

windows:
  length: 50

lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

training:
  seed: 42
  batch_size: 256
  learning_rate: 0.001
  max_epochs: 60
  patience: 8

cnn:
  # chosen on validation (python -m pipeline.grid cnn): fewer filters, val RMSE 22.65 -> 16.52;
  # dropout 0.3 made it worse with either size
  channels: [16, 32, 32]
  kernel_size: 5
  dropout: 0.0

conformal:
  coverage: 0.90

explain:
  sample_size: 2000
  seed: 42
  permutation_repeats: 5

monitoring:
  # simulated production. Test FD001 engines 1 to reference_engines are the normal
  # period of service the drift is measured against; the simulation replays the others.
  reference_engines: 50
  offset_sensors: [s_11, s_4]
  offset_std: 1.5
  offset_start: 0.5
  new_fault_subset: FD003
  drift_threshold: 0.1
  drift_share_threshold: 0.3
  error_window: 2000  # predictions in the rolling RMSE, about 15 engines

retraining:
  # the challenger is trained on FD001 + extra_subset, then compared with the champion
  # on the validation engines of both subsets (the test engines are only reported)
  extra_subset: FD003
  min_improvement: 0.02  # RMSE on all validation engines lowered by at least 2 %
  max_degradation: 0.10  # RMSE on the FD001 validation engines raised by less than 10 %
