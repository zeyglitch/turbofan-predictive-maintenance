data:
  subset: FD001
  url: "https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip"
  inner_sha256: "74bef434a34db25c7bf72e668ea4cd52afe5f2cf8e44367c55a82bfd91a5a34f"

prepare:
  rul_cap: 125
  sensors: [s_2, s_3, s_4, s_7, s_8, s_9, s_11, s_12, s_13, s_14, s_15, s_17, s_20, s_21]

split:
  seed: 42
  n_val: 15
  n_calib: 15

features:
  rolling_window: 30

ridge:
  alpha: 1.0

alert:
  threshold: 30

random_forest:
  n_estimators: 200
  max_depth: 12
  min_samples_leaf: 5
  random_state: 42

xgboost:
  n_estimators: 400
  learning_rate: 0.03
  max_depth: 3
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42

windows:
  length: 50

lstm:
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

training:
  seed: 42
  batch_size: 256
  learning_rate: 0.001
  max_epochs: 60
  patience: 8

cnn:
  channels: [32, 64, 64]
  kernel_size: 5

conformal:
  coverage: 0.90

explain:
  sample_size: 2000
  seed: 42
  permutation_repeats: 5

monitoring:
  # simulated production (phase 13). Test FD001 engines 1 to reference_engines are the normal
  # period of service the drift is measured against; the simulation replays the others.
  reference_engines: 50
  offset_sensors: [s_11, s_4]
  offset_std: 1.5
  offset_start: 0.5
  new_fault_subset: FD003
  drift_threshold: 0.1
  drift_share_threshold: 0.3
